<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークダウン練習帳 | AIかけこみ寺</title>
<meta name="description" content="AIに伝わりやすい書き方（マークダウン）を、書きながら覚える練習帳。書いたそばから整形後が見えます。お手本つき。書いたものはどこにも送られません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar">
  <a class="brand" href="https://ai-kakekomi.com/apps/">マークダウン練習帳<small>AIかけこみ寺</small></a>
  <span class="grow"></span>
  <button type="button" id="samples-btn" aria-expanded="false" aria-controls="samples">お手本をまるごと入れる</button>
  <a class="manual" href="manual.html">使い方</a>
</header>

<div class="samples" id="samples" aria-label="お手本" hidden>
  <span class="lbl">お手本：</span>
</div>

<main class="work">
  <section class="pane editor-pane" aria-label="書くところ">
    <div class="pane-head">
      <span class="name">書く</span>
      <span class="msg" id="count"></span>
      <span class="grow"></span>
      <button type="button" id="copy-md" class="primary">コピー（AIに貼る）</button>
      <button type="button" id="dl-md">.md で保存</button>
      <button type="button" id="clear" class="quiet">全部消す</button>
    </div>
    <div class="blocks" id="blocks" aria-label="ブロックを入れる">
      <span class="lbl">押すと入る：</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="まず「見出し」を押してみてください。押したものが、そのまま右（スマホでは上）に出ます。"></textarea>
  </section>

  <section class="pane preview-pane" aria-label="整形後">
    <div class="pane-head">
      <span class="name">整形後</span>
      <span class="grow"></span>
      <button type="button" id="copy-html">コピー</button>
      <button type="button" id="dl-html">.html で保存</button>
    </div>
    <div class="preview md is-empty" id="preview" aria-live="polite"></div>
  </section>
</main>

<footer class="foot">
  <p><strong>書いたものは、どこにも送られません。</strong>この端末のブラウザの中にだけ残ります（次に開いたときも続きから書けます）。ブラウザの履歴やデータを消すと、書いたものも消えるので、残したいものは「.md で保存」してください。</p>
  <p>非営利団体 <a href="https://ai-kakekomi.com">AIかけこみ寺</a> が作りました。プログラムはMITライセンスで公開しています（<a href="https://github.com/ai-kakekomi/markdown-practice" target="_blank" rel="noopener">GitHub</a>）。自分用に変えたい方は <a href="manual.html#ask-ai">使い方の「AIに頼む」</a> へ。</p>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="js/samples.js"></script>
<script src="js/app.js"></script>
</body>
</html>
